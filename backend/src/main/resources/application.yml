server:
  port: 8081

spring:
  application:
    name: backend
  datasource:
    url: jdbc:mariadb://localhost:3306/transparency_chain?createDatabaseIfNotExist=true
    username: root
    password: root
    driverClassName: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

polygon:
  amoy:
    rpc-url: ${POLYGON_AMOY_RPC_URL:https://rpc-amoy.polygon.technology/}
    private-key: ${POLYGON_AMOY_PRIVATE_KEY:}
    contract-address: ${POLYGON_AMOY_CONTRACT_ADDRESS:}

document:
  ai:
    project-id: ${DOCUMENT_AI_PROJECT_ID:}
    location: ${DOCUMENT_AI_LOCATION:us}
    processor-id: ${DOCUMENT_AI_PROCESSOR_ID:}
