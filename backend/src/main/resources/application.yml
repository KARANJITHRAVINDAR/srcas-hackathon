spring:
  application:
    name: backend
logging:
  level:
    org.springframework.security: DEBUG
  datasource:
    url: jdbc:h2:mem:transparency_chain
    username: sa
    password: 
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

